<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/app.js" defer></script>
<title>Ejemplo Java Script</title>
</head>
<body>

<h1>Hola mundo</h1>

<p>Ingresa tu nombre.</p>

<label for="nombre">Nombre:</label>
<input type="text" id="nombre" placeholder="Escribe tu nombre">

<button id="botonSaludar" type="button">Saludar</button>

<p id="mensaje">Aquí aparecerá tu saludo.</p>

<hr>

<h1>Personaliza tu tarjeta</h1>

<div id="tarjeta">Bienvenido a mi aplicación web</div>

<button id="botonAzul" type="button">Azul</button>
<button id="botonVerde" type="button">Verde</button>
<button id="botonRojo" type="button">Rojo</button>
<button id="botonRestablecer" type="button">Restablecer</button>

</body>
</html>
